<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Familiekalender</title>
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalender">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Innlogging -->
  <section id="login" class="screen" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <img src="icons/icon-192.png" alt="" class="login-logo">
      <h1 class="app-name">Familiekalender</h1>
      <label>E-post
        <input type="email" name="email" autocomplete="username" required inputmode="email">
      </label>
      <label>Passord
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn primary wide">Logg inn</button>
      <p class="form-msg" id="login-msg" role="alert"></p>
    </form>
  </section>

  <!-- Selve kalenderen -->
  <section id="app" class="screen" hidden>
    <div id="demo-banner" class="banner" hidden>Demomodus – avtalene lagres bare på denne enheten.</div>
    <div id="offline-banner" class="banner warn" hidden>Frakoblet – viser sist lagrede avtaler.</div>

    <header class="topbar">
      <div class="topbar-row">
        <button class="icon-btn" id="prev" aria-label="Forrige">‹</button>
        <button class="period" id="period-label" aria-label="Gå til i dag"></button>
        <button class="icon-btn" id="next" aria-label="Neste">›</button>
        <button class="btn small" id="today">I dag</button>
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Meny">⋯</button>
      </div>
      <div class="topbar-row">
        <div class="segmented" role="tablist" aria-label="Visning">
          <button role="tab" data-view="month">Måned</button>
          <button role="tab" data-view="week">Uke</button>
          <button role="tab" data-view="day">Dag</button>
        </div>
      </div>
      <div class="filters" id="filters" aria-label="Vis personer"></div>
    </header>

    <main id="view" class="view"></main>

    <button class="fab" id="add-btn" aria-label="Ny avtale">+</button>

    <div class="menu" id="menu" hidden>
      <p class="menu-user" id="menu-user"></p>
      <button class="btn wide" id="refresh-btn">Oppdater</button>
      <button class="btn wide" id="logout-btn">Logg ut</button>
    </div>
  </section>

  <!-- Ny / endre avtale -->
  <dialog id="editor">
    <form id="event-form" method="dialog">
      <header class="sheet-head">
        <button type="button" class="btn ghost" id="cancel-btn">Avbryt</button>
        <h2 id="editor-title">Ny avtale</h2>
        <button type="submit" class="btn primary" id="save-btn">Lagre</button>
      </header>

      <div class="sheet-body">
        <input name="title" class="title-input" placeholder="Hva skjer?" maxlength="200" required>

        <fieldset class="field">
          <legend>Hvem gjelder det?</legend>
          <div class="member-picker" id="member-picker"></div>
        </fieldset>

        <label class="switch-row">
          <span>Hele dagen</span>
          <input type="checkbox" name="all_day" id="all-day">
        </label>

        <div class="grid2">
          <label>Fra<input type="date" name="start_date" required></label>
          <label class="time-field">Kl.<input type="time" name="start_time" step="300"></label>
          <label>Til<input type="date" name="end_date" required></label>
          <label class="time-field">Kl.<input type="time" name="end_time" step="300"></label>
        </div>

        <div class="grid2">
          <label>Gjentas
            <select name="recurrence">
              <option value="none">Aldri</option>
              <option value="daily">Hver dag</option>
              <option value="weekly">Hver uke</option>
              <option value="biweekly">Annenhver uke</option>
              <option value="monthly">Hver måned</option>
              <option value="yearly">Hvert år</option>
            </select>
          </label>
          <label id="until-field">Til og med<input type="date" name="recur_until"></label>
        </div>
        <p class="hint" id="series-hint" hidden>Endringer gjelder hele serien.</p>

        <label>Sted<input name="location" maxlength="200"></label>
        <label>Notat<textarea name="notes" rows="3" maxlength="2000"></textarea></label>

        <p class="form-msg" id="editor-msg" role="alert"></p>

        <div class="danger-zone" id="delete-zone" hidden>
          <button type="button" class="btn danger wide" id="delete-one-btn" hidden>Slett bare denne dagen</button>
          <button type="button" class="btn danger wide" id="delete-btn">Slett avtale</button>
        </div>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
